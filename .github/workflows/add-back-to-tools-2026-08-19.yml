name: Add Back to tools link
on:
  push:
    paths:
      - '.github/workflows/add-back-to-tools-2026-08-19.yml'
permissions:
  contents: write
jobs:
  update-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update coordinate converter header
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<div class="internal"><span class="internal-dot"></span> Internal tool</div>'
          new = '<a class="back-link" href="https://rjconstantin.github.io/alberta-gis-tools/">Back to tools</a>'
          if old not in s:
              raise SystemExit('Expected header status was not found')
          s = s.replace(old, new, 1)
          marker = '  .site-disclaimer{'
          css = '  .back-link{color:var(--blue);font-size:13px;font-weight:700;text-decoration:none}\n'
          if '.back-link{' not in s:
              s = s.replace(marker, css + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Back to tools link to coordinate converter"
          git push
