name: Match coordinate header icon
on:
  push:
    paths:
      - '.github/workflows/match-header-icon-2026-08-19.yml'
permissions:
  contents: write
jobs:
  update-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match header icon to landing page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_css = '.brand-mark{color:#fff;background:var(--blue);border-radius:7px;place-items:center;width:27px;height:27px;font-family:Arial,Helvetica,sans-serif;font-size:18px;display:grid}'
          new_css = old_css + '.brand-mark svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}'
          if old_css in s and '.brand-mark svg{' not in s:
              s = s.replace(old_css, new_css, 1)
          old = '<div class="brand"><span class="brand-mark">C</span><span>Coordinate System Converter</span></div>'
          new = '''<div class="brand"><span class="brand-mark" aria-label="Coordinate conversion"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></span><span>Coordinate System Converter</span></div>'''
          if old not in s:
              raise SystemExit('Coordinate header brand block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Match coordinate converter header icon"
          git push